# Git hooks. Install once after cloning: bunx lefthook install
pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,mjs,ts,tsx}"
      run: bunx eslint {staged_files}
    format:
      glob: "*.{js,mjs,ts,tsx,json,yml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    test:
      root: "crawler/"
      glob: "*.ts"
      run: bun test
